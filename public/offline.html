<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyRoom — Offline</title>
  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .card {
      max-width: 380px;
      padding: 2rem;
      background-color: #121215;
      border: 1px solid #27272a;
      border-radius: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #a1a1aa;
      line-height: 1.5;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #fafafa;
      color: #09090b;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are Offline</h1>
    <p id="offline-desc">StudyRoom requires a network connection for live group synchronization. Please check your connection and try again.</p>
    <button onclick="sessionStorage.removeItem('sr_offline_reloads'); window.location.reload()">Retry Connection</button>
  </div>
  <script>
    (function() {
      var isRecovering = false;
      function recover() {
        if (isRecovering) return;
        var count = parseInt(sessionStorage.getItem('sr_offline_reloads') || '0', 10);
        if (count >= 3) {
          var desc = document.getElementById('offline-desc');
          if (desc) {
            desc.textContent = 'Connection is taking longer to respond. Please tap "Retry Connection" once your network or server is restored.';
          }
          return;
        }
        isRecovering = true;
        sessionStorage.setItem('sr_offline_reloads', (count + 1).toString());

        var path = window.location.pathname || '';
        if (path.endsWith('offline.html') || path.endsWith('/offline')) {
          window.location.replace('/room');
        } else {
          window.location.reload();
        }
      }

      // Instant event-driven recovery when browser reports online
      window.addEventListener('online', recover);

      // Recovery on document focus / foreground
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && navigator.onLine) {
          recover();
        }
      });
      window.addEventListener('focus', function() {
        if (navigator.onLine) recover();
      });

      // Autonomous active network reachability ping with exponential backoff (2s, 4s, 8s, 16s)
      // Note: Reaches origin for network reachability only. Application and channel sync health
      // are managed authoritatively by useLiveRoom.
      var delays = [2000, 4000, 8000, 16000];
      var delayIdx = 0;
      function pollConnectivity() {
        if (navigator.onLine) {
          fetch('/favicon.ico?_t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
            .then(function(res) {
              if (res.ok || res.status < 500) {
                recover();
              } else {
                scheduleNext();
              }
            })
            .catch(function() {
              scheduleNext();
            });
        } else {
          scheduleNext();
        }
      }
      function scheduleNext() {
        var delay = delays[delayIdx] || 16000;
        if (delayIdx < delays.length - 1) delayIdx++;
        setTimeout(pollConnectivity, delay);
      }
      scheduleNext();
    })();
  </script>
</body>
</html>
