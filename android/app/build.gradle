def resolveKeystore() {
    def candidates = [
        System.getenv("KEYSTORE_PATH"),
        project.findProperty("KEYSTORE_PATH") as String,
        "../keystore/release.keystore",
        "keystore/release.keystore",
        "release.keystore"
    ]

    for (String path : candidates) {
        if (path) {
            File f = file(path)
            if (f.exists()) return f
            f = rootProject.file(path)
            if (f.exists()) return f
            f = file("../" + path)
            if (f.exists()) return f
        }
    }
    return null
}

